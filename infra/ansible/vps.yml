# Small VPSes handed to external users, provisioned by modules/vps in tofu.
# Not part of common.yml: that targets the homelab group.
#
#   ansible-playbook vps.yml                    # every VPS
#   ansible-playbook vps.yml -l vps_<VPS-NAME>  # one of them
#
# Per-instance settings go in host_vars/<VPS-NAME>.yml, which is gitignored.

- name: External VPSes
  hosts: vps
  become: true

  # No vars block: play vars outrank host_vars, so the defaults live in
  # group_vars/vps.yml where a host can override them.

  handlers:
    # Debian 13 re-reads the config per connection via ssh.socket. Kept for the case where socket activation is off.
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Require at least one account
      ansible.builtin.assert:
        that: share_users | length > 0
        fail_msg: "share_users is empty. Set it in host_vars/{{ inventory_hostname }}.yml."

    # Every later task works from this rather than re-deriving the defaults.
    - name: Resolve each account's directory
      ansible.builtin.set_fact:
        share_dirs: "{{ share_dirs | default([]) + [{
          'name': item.key,
          'path': item.value.path   | default(share_root ~ '/' ~ item.key),
          'group': item.value.group | default(item.key),
          'mode': item.value.mode   | default('') }] }}"
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Require a credential for every account
      ansible.builtin.assert:
        that: item.value['keys'] | default([]) | length > 0
          or item.value.password_hash | default('') | length > 0
        fail_msg: >-
          {{ item.key }} has neither keys nor password_hash.
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # A plaintext password would be installed verbatim as the shadow hash: no login
    # would match it, and nothing would say so.
    - name: Require hashed passwords
      ansible.builtin.assert:
        that: item.value.password_hash is match('^\$[0-9a-z]+\$')
        fail_msg: "{{ item.key }}: password_hash must be a crypt hash, starting with $6$ or similar."
      when: item.value.password_hash | default('') | length > 0
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Fail closed: an unknown group digit would otherwise fall through to no flags at
    # all and hand out write access that looks configured.
    - name: Require a usable mode
      ansible.builtin.assert:
        that:
          - item.mode is match('^[0-7]{3,4}$')
          - item.mode[-2:-1] in share_flags
        fail_msg: >-
          {{ item.name }}: mode is '{{ item.mode }}'. It must be octal, quoted, with a
          group digit of {{ share_flags.keys() | join(', ') }} — that digit is what
          the account gets.
      loop: "{{ share_dirs }}"
      loop_control:
        label: "{{ item.name }}"

    # share_root itself is root-owned and holds the accounts' directories. An account
    # given it as its own path would take the group and mode of the directory the
    # others sit in, and could then delete them.
    - name: Refuse the base directory as a share
      ansible.builtin.assert:
        that: item.path != share_root
        fail_msg: >-
          {{ item.name }}: path is {{ share_root }}, which holds every account's
          directory. Leave path unset to get {{ share_root }}/{{ item.name }}.
      loop: "{{ share_dirs }}"
      loop_control:
        label: "{{ item.name }}"

    # Two accounts may share a directory, but only by agreeing on it.
    # Whichever ran last would otherwise win and take the directory from the other,
    #   and the run would report success either way.
    - name: Require agreement where accounts share a directory
      ansible.builtin.assert:
        that:
          - item.1 | map(attribute='group') | unique | length == 1
          - item.1 | map(attribute='mode') | unique | length == 1
        fail_msg: >-
          {{ item.1 | map(attribute='name') | join(' and ') }} both use {{ item.0 }}
          but disagree on group or mode. Give them the same of each, or separate paths.
      loop: "{{ share_dirs | groupby('path') }}"
      loop_control:
        label: "{{ item.0 }}"

    # openssh-server is already in the template. unattended-upgrades is not carried in
    # from common.yml, which targets the homelab group.
    - name: Install rsync and unattended-upgrades
      ansible.builtin.apt:
        name:
          - rsync
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    # An unattended reboot could drop an in-flight transfer.
    - name: Never reboot on its own
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51homelab-no-reboot
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";
        mode: "0644"

    # Without these the forced command fails every connection and nothing says why.
    - name: Check the two servers are present
      ansible.builtin.stat:
        path: "{{ item }}"
      register: share_bins
      loop:
        - "{{ share_rrsync }}"
        - "{{ share_sftp_server }}"

    - name: Require both servers
      ansible.builtin.assert:
        that: share_bins.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Missing: {{ share_bins.results | rejectattr('stat.exists')
                      | map(attribute='item') | join(', ') }}.
          Both ship with rsync and openssh-server; correct share_rrsync or
          share_sftp_server if this distribution puts them elsewhere.

    - name: Own the base directory
      ansible.builtin.file:
        path: "{{ share_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Membership is what the catch-all Match block at the end of sshd_config keys on.
    - name: Create the account group
      ansible.builtin.group:
        name: shareusers
        system: true

    # Only the ones that are not an account's own, which the user module makes.
    - name: Create any named groups
      ansible.builtin.group:
        name: "{{ item }}"
        system: true
      loop: "{{ share_dirs | map(attribute='group') | unique
                | difference(share_users.keys() | list) }}"

    # A real shell, not nologin: a ForceCommand is executed *through* the login shell.
    # "!" is a locked password, which is what an account keeps when only keys are set.
    - name: Create the accounts
      ansible.builtin.user:
        name: "{{ item.key }}"
        shell: /bin/sh
        create_home: true
        groups: "{{ ['shareusers'] + ([item.value.group] if item.value.group is defined else []) }}"
        append: true
        password: "{{ item.value.password_hash | default('!', true) }}"
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # The group is the account's own unless it names one, so the group digit is what
    # the account gets and the other digit decides whether the rest of the box can
    # look in.
    - name: Own the share directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ share_dirs }}"
      loop_control:
        label: "{{ item.name }}"

    # Nothing confines an sftp session to a subtree without a chroot, so the homes have
    # to stop being writable — otherwise uploads could land there, on the 8G rootfs,
    # instead of on the quota'd data volume.
    - name: Take the home away from each account
      ansible.builtin.file:
        path: "/home/{{ item.key }}"
        state: directory
        owner: root
        group: root
        mode: "0555"
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # root-owned for the same reason: sshd reads authorized_keys as root, and an
    # account being able to append to its own is how revocation stops working.
    - name: Create .ssh
      ansible.builtin.file:
        path: "/home/{{ item.key }}/.ssh"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # `restrict` is the catch-all, and stays correct as OpenSSH adds options. No
    # command= alongside it: it would confine key logins only, and sshd's own
    # ForceCommand overrides it anyway, so it would read as the restriction while
    # enforcing nothing. Dropping a key here and re-running revokes it.
    - name: Install the restricted authorized_keys
      ansible.builtin.copy:
        dest: "/home/{{ item.key }}/.ssh/authorized_keys"
        owner: root
        group: root
        mode: "0600"
        content: |
          {% for key in item.value['keys'] | default([]) %}
          restrict {{ key }}
          {% endfor %}
      loop: "{{ share_users | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # sshd runs one forced command per session and settles on it before it knows what
    # the client wants, so supporting both protocols means branching here instead.
    # rsync announces itself in the command it asks for; a graphical client asks for
    # the sftp subsystem, and anything else gets sftp-server too — which speaks a
    # protocol, not a shell, so an unrecognised request achieves nothing.
    #
    # rrsync reads the same variable to work out what was requested, and rejects any
    # path outside the directory it is given. -l INFO logs every open, write and
    # delete to auth.log, which is the only record of what an outside user did —
    # rsync leaves none.
    - name: Install the dispatch scripts
      ansible.builtin.copy:
        dest: "{{ share_dispatch_dir }}/share-{{ item.name }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by ansible — infra/ansible/vps.yml. {{ item.name }}, mode {{ item.mode }}.
          case "$SSH_ORIGINAL_COMMAND" in
            "rsync --server"*) exec {{ share_rrsync }} {{ flags.rsync }} {{ item.path }} ;;
            *)                 exec {{ share_sftp_server }} -d {{ item.path }} -l INFO {{ flags.sftp }} ;;
          esac
      vars:
        flags: "{{ share_flags[item.mode[-2]] }}"
      loop: "{{ share_dirs }}"
      loop_control:
        label: "{{ item.name }}"

    # PermitRootLogin differs from common.yml: an LXC has no cloud-init, so root over
    # key auth is Ansible's only way back in.
    #
    # A Match block per account is the whole of the confinement, for either credential
    # — ForceCommand replaces anything the client asked for, including a shell.
    # Password auth is global-off and enabled only for the accounts that have a hash.
    #
    # An account dropped from share_users keeps its keys and its home on the box, and
    # loses only its block here. The last block catches it: sshd applies every Match
    # that fits and keeps the first value it was given, so a named account's own
    # ForceCommand still wins, and anything left over gets /bin/false.
    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          {% for name, user in share_users.items() %}

          Match User {{ name }}
            AllowTcpForwarding no
            AllowAgentForwarding no
            X11Forwarding no
            PermitTTY no
            ForceCommand {{ share_dispatch_dir }}/share-{{ name }}
          {% if user.password_hash | default('') | length > 0 %}
            PasswordAuthentication yes
          {% endif %}
          {% endfor %}

          Match Group shareusers
            AllowTcpForwarding no
            AllowAgentForwarding no
            X11Forwarding no
            PermitTTY no
            ForceCommand /bin/false
            PasswordAuthentication no
        mode: "0644"
        validate: sshd -t -f %s
      notify: Restart sshd
