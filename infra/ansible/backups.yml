# Backups that run on the host rather than inside a compose stack.
#
# The GitLab backup has to 'docker exec' into the gitlab container.
# Doing that from a container means mounting the docker socket, which is root on
# the host (AUDIT H1, L15). A cron job on the VM needs no socket at all.
#
#   ansible-playbook backups.yml --tags gitlab-backup

- name: Backups on vm-core
  hosts: vm_core
  become: true

  roles:
    # Kuma is published on this host and deliberately off the homelab network, so
    # the ping goes straight to the local bind rather than out through the proxy.
    # gitlab_backup_push_token is generated by group_vars/homelab.yml.
    - role: gitlab_backup
      gitlab_backup_push_url: "http://127.0.0.1:3001/api/push/{{ gitlab_backup_push_token }}"
      tags: [gitlab-backup]

    # Addressed off the games group, so inventory.external.ini stays the only place the
    # host is named. Skipped rather than failed when that group is empty: the external
    # inventory is gitignored, and a checkout without it should still run the rest.
    - role: game_backup
      game_backup_name: valheim
      game_backup_ssh_alias: "{{ hostvars[groups['games'][0]].ansible_host }}"
      game_backup_remote_dir: "~/homelab/valheim/backups"
      game_backup_verify_src: verify-valheim.sh.j2
      game_backup_restore_src: restore-valheim.j2
      game_backup_push_url: "http://127.0.0.1:3001/api/push/{{ game_backup_push_token }}"
      when: groups['games'] | default([]) | length > 0
      tags: [valheim-backup]
