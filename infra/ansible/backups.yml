# Backups that run on the host rather than inside a compose stack.
#
# The GitLab backup has to 'docker exec' into the gitlab container.
# Doing that from a container means mounting the docker socket, which is root on
# the host (AUDIT H1, L15). A cron job on the VM needs no socket at all.
#
#   ansible-playbook backups.yml --tags gitlab-backup

- name: Backups on vm-core
  hosts: vm_core
  become: true

  roles:
    # Kuma is published on this host and deliberately off the homelab network, so
    # the ping goes straight to the local bind rather than out through the proxy.
    # gitlab_backup_push_token is generated by group_vars/homelab.yml.
    - role: gitlab_backup
      gitlab_backup_push_url: "http://127.0.0.1:3001/api/push/{{ gitlab_backup_push_token }}"
      tags: [gitlab-backup]
