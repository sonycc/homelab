#https://docs.ansible.com/projects/ansible/latest/reference_appendices/config.html

[defaults]
# Two sources:
# - tofu rewrites inventory.ini on every apply and owns it
# - hosts that are not provisioned by tofu go in the hand-written file
# Groups merge across both.
inventory = inventory.ini,inventory.external.ini
interpreter_python = auto_silent

#https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/ssh_connection.html
[ssh_connection]
# accept-new trusts a host key the first time but still fails if it later changes,
# unlike StrictHostKeyChecking=no. The VMs are new, so every key is unknown.
ssh_args = -C -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
