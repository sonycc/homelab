services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.1-ce.0
    container_name: gitlab
    restart: unless-stopped

    # Container hostname is 'gitlab' (not the public FQDN) so it doesn't collide
    # with NPM's gitlab.<domain> network alias — internal clients must resolve that
    # name to NPM (:443 TLS), not to this container. Public identity is set by
    # external_url below, not by this hostname.
    hostname: gitlab

    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.${DOMAIN:?DOMAIN not set}'

        # Disable bundled PostgreSQL — use the shared postgres stack
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'unicode'
        gitlab_rails['db_host'] = 'postgres'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = '${GITLAB_DB_NAME}'
        gitlab_rails['db_username'] = '${GITLAB_DB_USER}'
        gitlab_rails['db_password'] = '${GITLAB_DB_PASSWORD}'

        # Let Nginx Proxy Manager handle TLS termination
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['client_max_body_size'] = '0'
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

        # Without this, Rails treats the reverse proxy as the client and logs
        # "remote_ip":"172.21.0.2" (nginx) on every request — the CF-Connecting-IP
        # header reaches GitLab, but nothing tells it that header is trustworthy.
        # That breaks anything keyed on client identity: rate limiting, the abuse
        # dashboard, audit events, and in particular the fail2ban gitlab-auth jail
        # in the proxy stack, which would otherwise ban nginx at the Cloudflare
        # edge and take the whole homelab offline.
        gitlab_rails['trusted_proxies'] = ['172.21.0.0/16']

        # SSH port as seen from outside the host
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}

        # Timezone
        gitlab_rails['time_zone'] = 'Europe/Oslo'

        # Reduce memory usage
        puma['worker_processes'] = 1
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false

        # Container registry — advertised at registry.<domain> (must match the NPM
        # proxy host + Cloudflare tunnel hostname). Internal nginx listens on 5050;
        # NPM terminates TLS and proxies that hostname → gitlab:5050.
        registry_external_url 'https://registry.${DOMAIN:?DOMAIN not set}'
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false

    ports:
      - "${GITLAB_SSH_PORT}:22"
      - "${GITLAB_BIND:-127.0.0.1}:${GITLAB_HTTP_PORT:-8080}:80"
      - "${GITLAB_BIND:-127.0.0.1}:${GITLAB_REGISTRY_PORT:-5050}:5050"

    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

    networks:
      - homelab

    shm_size: '256m'

    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
        reservations:
          memory: 1g

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

networks:
  homelab:
    external: true
