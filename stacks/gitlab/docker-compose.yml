services:
  gitlab:
    image: gitlab/gitlab-ce:19.0.2-ce.0
    container_name: gitlab
    restart: unless-stopped

    hostname: ${GITLAB_HOSTNAME}

    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOSTNAME}'

        # Disable bundled PostgreSQL — use the shared postgres stack
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_encoding'] = 'unicode'
        gitlab_rails['db_host'] = 'postgres'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = '${GITLAB_DB_NAME}'
        gitlab_rails['db_username'] = '${GITLAB_DB_USER}'
        gitlab_rails['db_password'] = '${GITLAB_DB_PASSWORD}'

        # Let Nginx Proxy Manager handle TLS termination
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

        # SSH port as seen from outside the host
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}

        # Timezone
        gitlab_rails['time_zone'] = 'Europe/Oslo'

        # Reduce memory usage
        puma['worker_processes'] = 1
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false

        # Container registry — served on port 5050, TLS terminated by NPM
        registry_external_url 'https://registry.${GITLAB_HOSTNAME}'
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false

    ports:
      - "${GITLAB_SSH_PORT}:22"
      - "${GITLAB_HTTP_PORT:-8080}:80"
      - "${GITLAB_REGISTRY_PORT:-5050}:5050"

    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

    networks:
      - homelab

    shm_size: '256m'

    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
        reservations:
          memory: 1g

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m

  # H1 (open): The host Docker socket is mounted here, giving CI jobs potential
  # root access to the host. Options to close it:
  #   - tecnativa/docker-socket-proxy: filtered TCP proxy in front of the socket
  #   - rootless Docker on the host + userns_remap on the daemon
  gitlab-runner:
    image: gitlab/gitlab-runner:v17.11.4
    container_name: gitlab-runner
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    environment:
      GITLAB_RUNNER_TOKEN: ${GITLAB_RUNNER_TOKEN}
      GITLAB_INTERNAL_URL: ${GITLAB_INTERNAL_URL:-http://gitlab:80}
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./runner/entrypoint.sh:/entrypoint.sh:ro
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "gitlab-runner", "verify", "--delete"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  gitlab_runner_config:

networks:
  homelab:
    external: true
