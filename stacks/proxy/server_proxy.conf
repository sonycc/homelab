# Mounted at /data/nginx/custom/server_proxy.conf — NPM includes this inside the
# `server` block of every enabled proxy host.
# https://nginxproxymanager.com/advanced-config/#custom-nginx-configurations

# Traffic reaches nginx from the cloudflared container, so $remote_addr is that
# container's address and the real client survives only in this header.
# The image's nginx.conf already sets `real_ip_header X-Real-IP` in the http
# context and `real_ip_recursive on`; repeating either there is a duplicate
# directive, so the override belongs at server level, where it wins and the
# `set_real_ip_from` subnets are inherited.
real_ip_header CF-Connecting-IP;
