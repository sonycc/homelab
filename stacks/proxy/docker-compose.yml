services:
  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    # Loopback only — the sole consumer is `tunnel ready` in the healthcheck below,
    # running inside this container, so it never needs to leave the netns.
    environment:
      TUNNEL_METRICS: 127.0.0.1:60123

    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # All public traffic enters via the cloudflared tunnel → nginx:80.
  # nginx has no host-level port bindings; it is only reachable via the Docker network.
  #
  # ${DOMAIN} below is the apex domain from .env — the real hostnames are
  # gitlab.<domain>, monitoring.<domain> and so on.
  #
  # NPM proxy hosts (configured in the UI):
  #   gitlab.${DOMAIN}      → http://gitlab:80    (Block Exploits: on)
  #   monitoring.${DOMAIN}  → http://grafana:3000
  #   registry.${DOMAIN}    → http://gitlab:5050
  #   ha.${DOMAIN}          → http://homeassistant:8123  (Websockets Support: on)
  #   wud.${DOMAIN}         → http://wud:3000
  #
  # Cloudflare tunnel public hostnames
  # * → http://nginx:80.

  nginx:
    image: 'jc21/nginx-proxy-manager:2.15.1'
    restart: unless-stopped

    # Admin UI bound to localhost only — not exposed on the LAN. Public traffic
    # still enters solely via the cloudflared tunnel → nginx:80.
    ports:
      - "127.0.0.1:81:81"

    environment:
      TZ: "Europe/Oslo"
      # Postgres parameters:
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: ${NGINX_DB_USER}
      DB_POSTGRES_PASSWORD: ${NGINX_DB_PASSWORD}
      DB_POSTGRES_NAME: ${NGINX_DB_NAME}
      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/nginx.conf

    # Split-horizon: internal containers (incl. CI job containers via dind) resolve
    # the public hostnames to NPM over the homelab network, so they hit the same
    # HTTPS endpoint + valid cert as external clients — no internal/external URL split.
    networks:
      homelab:
        aliases:
          - gitlab.${DOMAIN:?DOMAIN not set}
          - registry.${DOMAIN:?DOMAIN not set}

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── fail2ban: commented out for the migration, re-enable once gitlab and
# monitoring are on this host ──────────────────────────────────────────────────
#
# Its gitlab_logs and grafana_logs mounts are external volumes owned by those
# stacks. Compose refuses to bring up the whole stack while they are missing —
# "external volume gitlab_gitlab_logs not found" — which is what blocked this
# stack from deploying at all.
#
# Consequence while it is off: a hostname flipped to tunnel B has no edge banning.
# The old host's fail2ban cannot read this NPM's logs, so protection stops at the
# moment of the flip rather than at decommissioning. Uncomment the service and the
# two external volumes at the bottom to restore it; nothing else changes.
#
#   # fail2ban — parses the logs of every public-facing service and bans abusive
#   # clients through the Cloudflare API.
#   #
#   # It bans at the edge rather than with iptables because nothing local can see a
#   # real client address: packets arrive from the cloudflared container, and the
#   # true IP survives only in the CF-Connecting-IP header. See
#   # fail2ban/action.d/cloudflare-api.conf for the full reasoning, and
#   # fail2ban/jail.d/homelab.conf for the jails and their thresholds.
#   #
#   # Consequence worth remembering: an edge ban applies to the whole zone, so a
#   # false positive blocks every hostname at once. The LAN paths in — NPM's admin
#   # UI on 127.0.0.1:81 and HA on 127.0.0.1:8123 — are unaffected and are the way
#   # back in, along with the Cloudflare dashboard.
#   #
#   # Deliberately NOT granted cap_add: NET_ADMIN. The usual fail2ban deployment
#   # needs it to write iptables rules; this one only makes HTTPS calls, so a
#   # process that parses attacker-controlled log lines stays unprivileged.
