services:
  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: 'jc21/nginx-proxy-manager:2.12.3'
    restart: unless-stopped
    ports:
      - '127.0.0.1:81:81'     # Admin Web Port (local only)

    environment:
      TZ: "Europe/Oslo"
      # Postgres parameters:
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: ${NGINX_DB_USER}
      DB_POSTGRES_PASSWORD: ${NGINX_DB_PASSWORD}
      DB_POSTGRES_NAME: ${NGINX_DB_NAME}
      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'
      
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/nginx.conf

    networks:
      - homelab

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  homelab:
    external: true