services:
  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - homelab
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3

  # All public traffic enters via the cloudflared tunnel → nginx:80.
  # nginx has no host-level port bindings; it is only reachable via the Docker network.
  #
  # To access the NPM admin UI: SSH port-forward from your workstation:
  #   ssh -L 8081:localhost:81 <homelab-host>
  #   then open http://localhost:8081
  # (temporarily add "ports: ['127.0.0.1:81:81']" to this service if you prefer)
  #
  # NPM proxy hosts (configured in the UI):
  #   gitlab.sxd.no        → http://gitlab:80    (Block Exploits: on)
  #   monitoring.sxd.no    → http://grafana:3000
  #   registry.sxd.no      → http://gitlab:5050
  #
  # Cloudflare tunnel public hostnames (Zero Trust dashboard):
  #   gitlab.sxd.no        → http://nginx:80
  #   monitoring.sxd.no    → http://nginx:80
  #   registry.sxd.no      → http://nginx:80
  nginx:
    image: 'jc21/nginx-proxy-manager:2.12.3'
    restart: unless-stopped

    environment:
      TZ: "Europe/Oslo"
      # Postgres parameters:
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: ${NGINX_DB_USER}
      DB_POSTGRES_PASSWORD: ${NGINX_DB_PASSWORD}
      DB_POSTGRES_NAME: ${NGINX_DB_NAME}
      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx.conf:/etc/nginx/nginx.conf

    networks:
      - homelab

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 64m

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  homelab:
    external: true
