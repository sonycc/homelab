# Nginx Proxy Manager access log — authentication failures.
#
# NPM does not use the combined log format, so the stock nginx-http-auth and
# nginx-botsearch filters match zero lines here. The real format is:
#
#   [26/Jul/2026:23:22:41 +0200] - 401 401 - GET http ha.sxd.no "/auth/token" \
#     [Client 2a02:fe1:...] [Length 27] [Gzip -] [Sent-to homeassistant] "UA" "ref"
#
# Field order: [time] cache_status status upstream_status upstream_time method
# scheme host "uri" [Client addr] ...
#
# The client address here is already the true origin IP, because nginx.conf sets
# `real_ip_header CF-Connecting-IP` and trusts the Docker subnet.

[Definition]

# fail2ban strips the matched datepattern from the line before applying
# failregex, so the expression starts after the closing bracket of the timestamp.
failregex = ^ \S+ (?:401|403) \d+ .*\[Client <HOST>\]

# Git over HTTP *always* gets a 401 on the first /info/refs request and only then
# retries with credentials — that is the protocol, not an attack. Matching it
# would ban every legitimate git user, including the CI runner reaching GitLab
# back through the tunnel via the WAN address.
ignoreregex = ^ \S+ 401 \d+ .*"/[^"]*\.git/(?:info/refs|git-upload-pack|git-receive-pack)
              ^ \S+ 401 \d+ .*"/[^"]*/(?:info/refs|git-upload-pack|git-receive-pack)

datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
