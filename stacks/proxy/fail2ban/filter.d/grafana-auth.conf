# Grafana — failed logins.
#
# Source: the monitoring_grafana_logs volume, mounted read-only. Grafana only
# writes to stdout by default, so stacks/monitoring/docker-compose.yml was given
# GF_LOG_MODE="console file" to produce a file this filter can tail.
#
# LEAST-VERIFIED FILTER OF THE SET. There were no failed Grafana logins in the
# logs at the time of writing, so these expressions are written against Grafana's
# documented logfmt output rather than a captured sample. Confirm with one
# deliberate bad login before relying on it:
#   docker exec fail2ban fail2ban-regex /var/log/grafana/grafana.log \
#     /data/filter.d/grafana-auth.conf --print-all-matched
#
# Second caveat: Grafana has no trusted-proxy setting of its own. It reports
# remote_addr from X-Real-IP / X-Forwarded-For when those headers are present,
# which NPM does set — but if a sample shows a 172.21.x.x address instead of the
# real client, this jail must stay disabled, for the same reason spelled out in
# gitlab-auth.conf.

[Definition]

failregex = level=(?:warn|error) msg="Invalid username or password".*remote_addr=<HOST>
            msg="Request Completed".*path=/login.*status=401.*remote_addr=<HOST>
            msg="Failed to authenticate request".*remote_addr=<HOST>

ignoreregex =

# Grafana logs UTC with nanosecond precision (t=2026-07-26T22:22:55.135476855Z)
# while this container runs Europe/Oslo. See gitlab-auth.conf for the full
# reasoning: without %z entries parse 2h in the past and the jail cannot fire,
# and %f will not match 9 fractional digits — (?:\.\d+)? does.
datepattern = t=%%Y-%%m-%%dT%%H:%%M:%%S(?:\.\d+)?%%z
