# GitLab — failed sign-ins.
#
# Source: the gitlab_gitlab_logs volume, mounted read-only at /var/log/gitlab.
#
# IMPORTANT PRECONDITION: this filter is only safe once GitLab resolves the real
# client address. Out of the box it logged "remote_ip":"172.21.0.2" — nginx —
# for every request, because gitlab_rails['trusted_proxies'] was unset. Running
# this jail against that would have banned the reverse proxy at the Cloudflare
# edge and taken every service in the homelab offline at once. The trusted_proxies
# setting was added to stacks/gitlab/docker-compose.yml alongside this filter;
# do not enable this jail without it.
#
# Verify before trusting, with one deliberate bad login:
#   docker exec fail2ban fail2ban-regex \
#     /var/log/gitlab/gitlab-rails/production_json.log \
#     /data/filter.d/gitlab-auth.conf --print-all-matched

[Definition]

# Rails re-renders the sign-in form on failure, which surfaces as 422 in modern
# GitLab; 401 covers API and older paths. Matching only these two keeps ordinary
# 200-returning page loads out of the jail.
failregex = "path":"/users/sign_in".*"status":(?:401|422).*"remote_ip":"<HOST>"
            "message":"Failed Login: [^"]*ip=<HOST>
            "path":"/oauth/token".*"status":401.*"remote_ip":"<HOST>"

# The CI runner polls /api/v4/jobs/request constantly and briefly 401s on token
# rotation; it reaches GitLab back through the tunnel, so its source address is
# the WAN IP. Banning that would cut off the whole household, not just CI.
ignoreregex = "path":"/api/v4/(?:jobs/request|runners/verify)"

# GitLab logs UTC ("...Z") while this container runs Europe/Oslo. Omitting the
# timezone made fail2ban read every entry as local time — 2h in the past — so
# with findtime=10m no failure ever landed inside the window and the jail could
# not ban anyone. Verified against fail2ban's own parser: without %z the epoch is
# off by exactly -2.0h; with it, correct.
#
# %z rather than a literal Z, so the offset is actually applied. (?:\.\d+)? and
# not %f, because %f caps out around 6 digits and silently fails to match
# nanosecond timestamps — Grafana writes 9, and this form handles both.
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.\d+)?%%z
