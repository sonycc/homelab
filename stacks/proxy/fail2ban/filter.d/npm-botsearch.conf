# Nginx Proxy Manager access log — vulnerability scanners.
#
# Matches requests for paths that nothing in this homelab serves, so a hit is
# never a legitimate client. Deliberately path-based rather than "ban on N 404s":
# a broken dashboard or a stale bookmark can produce a burst of 404s, and this
# jail's ban lands at the Cloudflare edge where a false positive locks the user
# out of every service at once.
#
# See npm-auth.conf for the log format. Status is not constrained — a scanner
# probing /wp-login.php is hostile whether it gets 404, 403 or 301.
#
# Each pattern is a separate failregex line rather than one alternation in a
# shared variable: fail2ban joins continuation lines with a newline, which
# silently truncates a multi-line regex at the first break.

[Definition]

# Everything up to and including the opening quote of the request URI.
_pre = ^ \S+ \d+ \d+ \S+ \S+ \S+ \S+ "
_post = [^"]*" \[Client <HOST>\]

# The leading slash before \.git matters: GitLab legitimately serves
# /group/repo.git/info/refs, where .git follows a repository name. A request for
# /.git/config at the web root is a source-tree exposure probe. Same reasoning
# applies to the /pma/ and /vendor/ paths — anchored on slashes so they cannot
# match a project or file that merely contains those letters.
# Every alternative carries its own leading slash and is preceded by [^"]* so it
# matches both at the web root (/.env) and nested (/app/.env). Putting the slash
# in the prefix instead would silently miss every root-level probe.
failregex = %(_pre)s[^"]*(?:/wp-login\.php|/wp-admin/|/xmlrpc\.php|/wp-content/|/wp-includes/)%(_post)s
            %(_pre)s[^"]*(?:/phpmyadmin|/phpMyAdmin|/pma/|/myadmin/)%(_post)s
            %(_pre)s[^"]*(?:/\.env|/\.aws/credentials|/\.ssh/id_[a-z]+)%(_post)s
            %(_pre)s[^"]*(?:/vendor/phpunit|/eval-stdin\.php|/phpinfo\.php|/shell\.php)%(_post)s
            %(_pre)s[^"]*(?:/\.svn/|/\.hg/|/\.bzr/)%(_post)s
            %(_pre)s[^"]*(?:/cgi-bin/|/boaform/|/HNAP1|/GponForm)%(_post)s
            %(_pre)s/\.git/(?:config|HEAD|index)%(_post)s

ignoreregex =

datepattern = ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
