# Home Assistant — failed logins and invalid-token requests.
#
# Source: stacks/homeassistant/config/home-assistant.log, mounted read-only.
#
# HA emits these from homeassistant.components.http.ban regardless of whether its
# own `ip_ban_enabled` is on, so this filter works even with HA's built-in
# banning disabled. The two are complementary: HA's own ban list is per-instance
# and only blocks at the HA process, while this one blocks at Cloudflare's edge
# before the request reaches the homelab at all.
#
# The address HA logs is the true client IP only because configuration.yaml sets
# use_x_forwarded_for + trusted_proxies for the Docker subnet. Without that, HA
# would log nginx's address and this jail would ban the proxy.

[Definition]

# No __prefix_line here — that helper expects a syslog prefix, and HA writes a
# plain "<level> (<thread>) [<logger>] <message>" line once the date is stripped.
failregex = ^\.?\d* +WARNING .*Login attempt or request with invalid authentication from <HOST>
            ^\.?\d* +WARNING .*Invalid password for [^ ]+ from <HOST>
            ^\.?\d* +WARNING .*Login attempt failed for .* from <HOST>

ignoreregex =

# HA log lines start: 2026-07-26 22:42:03.123 WARNING (MainThread) [logger] msg
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
