# Ban action: Cloudflare IP Access Rules.
#
# Why not iptables: every public request reaches nginx through the cloudflared
# container, so the kernel only ever sees 172.21.0.14 as the packet source. The
# real client address exists solely in the CF-Connecting-IP header, which
# ../nginx.conf turns into $remote_addr via `real_ip_header`. A local firewall
# rule has nothing useful to match on, so the ban has to be applied at
# Cloudflare's edge — before the tunnel, and before it costs any bandwidth.
#
# ── Why this file contains no shell ────────────────────────────────────────────
# fail2ban's config parser treats a semicolon PRECEDED BY WHITESPACE as an inline
# comment and strips the rest of the line. An earlier version of this action had
# the logic inline, and `case "<ip>" in *:*) target=ip6 ;; *) target=ip ;; esac`
# reached sh as `case "1.2.3.4" in *:*) target=ip6` — an unterminated case, a
# syntax error, and every ban silently failing. `fail2ban-client -t` still
# reported the configuration valid, because the truncation happens at parse time
# and nothing validates the resulting shell.
#
# All logic therefore lives in ../bin/cloudflare.sh. Keep this file free of
# semicolons and multi-line values.
#
# Credentials come from the container environment (CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID, set from the proxy stack's .env), so no secret lands in
# a tracked file. fail2ban runs actions through a shell, which inherits the
# daemon's environment.
#
# Token scope (Cloudflare dashboard → Manage Account → API Tokens → Create Token):
#   Permissions: Account → Firewall Access Rules → Edit
#   Resources:   Include → your account
#   Expiry:      none.  Client IP filtering: none (this homelab's egress rotates)
#
# Invoked via `sh` so the script needs no executable bit — the config is bind
# mounted from a Windows host, where the mode bit does not survive reliably.

[Definition]

actionstart = sh /data/bin/cloudflare.sh verify
actionstop =
actioncheck =
actionban = sh /data/bin/cloudflare.sh ban "<ip>" "<name>"
actionunban = sh /data/bin/cloudflare.sh unban "<ip>"
