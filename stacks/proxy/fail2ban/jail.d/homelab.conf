# fail2ban jails for the homelab.
#
# Every jail bans through action.d/cloudflare-api.conf — see that file for why a
# local firewall action would be useless here.
#
# ── Read this before tuning ────────────────────────────────────────────────────
# A ban applied at the Cloudflare edge blocks the address for EVERY hostname on
# the zone, not just the service that triggered it. One false positive locks you
# out of GitLab, Grafana, Home Assistant, WUD and the registry simultaneously,
# and the only way back in is the Cloudflare dashboard (or the LAN, since NPM's
# admin UI on 127.0.0.1:81 and HA on 127.0.0.1:8123 stay reachable). Thresholds
# below are deliberately loose for that reason.
#
# ── The hairpin trap ───────────────────────────────────────────────────────────
# Internal clients reach the public hostnames through the tunnel and come back in
# with the household's WAN address as their source — the GitLab runner shows up
# in NPM's logs as a public address, not a Docker one. A jail that fires on that
# bans the entire household, not one attacker.
#
# Pinning that address in ignoreip is NOT a workable defence here: the homelab
# egressed as 84.215.23.113 on 2026-07-26 and as 88.90.1.16 on 2026-07-27, so the
# address rotates (dynamic lease or ISP-side NAT pool). A stale entry would
# protect an address the household no longer holds while leaving the current one
# bannable. The git-protocol 401 exclusions in npm-auth.conf and gitlab-auth.conf
# are therefore the real protection — keep them intact.

[DEFAULT]

# Docker subnet first: nginx (172.21.0.2) and cloudflared (172.21.0.14) appear as
# the source on any log line where real-IP resolution has not been configured.
# Banning either one takes the whole homelab offline.
ignoreip = 127.0.0.1/8
           ::1
           172.21.0.0/16
           10.0.0.0/8
           192.168.0.0/16
           # Deliberately no WAN address here — it rotates. See "hairpin trap" above.

banaction = cloudflare-api
# No local firewall action, so there is nothing to apply to a restarted daemon;
# the ban lives in Cloudflare's rule list, which survives container restarts.
# fail2ban's own db (/data/db) is a named volume so unban timers survive too.
backend = polling

bantime = 1h
findtime = 10m
maxretry = 5

# Repeat offenders escalate; one-off fat-finger logins do not.
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 7d


# ── Catch-all: authentication failures across every proxied host ───────────────
# Highest value per line of config, since all tunnelled traffic passes through
# NPM. Covers Grafana and WUD implicitly even though they have no jail of their
# own, because a failed login there still surfaces as a 401 here.
[npm-auth]
enabled = true
filter = npm-auth
logpath = /var/log/npm/proxy-host-*_access.log
maxretry = 8
findtime = 10m
bantime = 1h


# ── Vulnerability scanners ────────────────────────────────────────────────────
# A single request for /wp-login.php is already conclusive, but maxretry = 2
# guards against one unlucky regex false positive banning a real visitor.
[npm-botsearch]
enabled = true
filter = npm-botsearch
logpath = /var/log/npm/proxy-host-*_access.log
maxretry = 2
findtime = 30m
bantime = 24h


# ── GitLab sign-ins ───────────────────────────────────────────────────────────
# DO NOT enable until `docker exec gitlab grep trusted_proxies /etc/gitlab/gitlab.rb`
# confirms the setting took effect and production_json.log shows a real client
# address in "remote_ip" rather than 172.21.0.2. See gitlab-auth.conf.
[gitlab-auth]
enabled = true
filter = gitlab-auth
logpath = /var/log/gitlab/gitlab-rails/production_json.log
          /var/log/gitlab/gitlab-rails/application_json.log
maxretry = 5
findtime = 10m
bantime = 2h


# ── Home Assistant ────────────────────────────────────────────────────────────
# Complements HA's own ip_ban_enabled rather than replacing it: HA's list blocks
# at the HA process, this one blocks at Cloudflare before the request arrives.
[homeassistant-auth]
enabled = true
filter = homeassistant-auth
logpath = /var/log/ha/home-assistant.log
maxretry = 5
findtime = 10m
bantime = 2h


# ── Grafana ───────────────────────────────────────────────────────────────────
# Disabled by default: the filter is written against Grafana's documented logfmt
# output, not a captured failure, and Grafana's remote_addr handling behind a
# proxy is unverified here. Confirm with fail2ban-regex (command in
# grafana-auth.conf), then flip this to true. Until then [npm-auth] still catches
# Grafana brute-force attempts via their 401s.
[grafana-auth]
enabled = false
filter = grafana-auth
logpath = /var/log/grafana/grafana.log
maxretry = 5
findtime = 10m
bantime = 2h
