# Valheim dedicated server, reached over WAN through a playit.gg tunnel.
#
# playit shares the server's network namespace, so it reaches the game on
# 127.0.0.1:2456 and nothing has to be published to the host. Recreating the
# valheim container tears that namespace down and takes playit with it,
# so bring the stack back with `docker compose up -d`, never `docker restart valheim`.

services:
  valheim:
    image: ghcr.io/community-valheim-tools/valheim-server:1.2.0
    container_name: valheim
    restart: unless-stopped

    # The server saves the world on shutdown. Compose's 10s default kills it mid-save.
    stop_grace_period: 2m

    cap_add:
      - SYS_NICE

    environment:
      TZ: ${TZ:-Europe/Oslo}

      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME not set}
      WORLD_NAME: ${WORLD_NAME:?WORLD_NAME not set}
      SERVER_PASS: ${SERVER_PASS:?SERVER_PASS not set}

      # Behind the tunnel the server would advertise an address that is only
      # reachable inside its own namespace. Players join by IP instead.
      SERVER_PUBLIC: "false"

      RESTART_CRON: ${RESTART_CRON:-0 5 * * *}
      RESTART_IF_IDLE: ${RESTART_IF_IDLE:-true}

      BACKUPS_MAX_AGE: ${BACKUPS_MAX_AGE:-14}
      BACKUPS_MAX_COUNT: ${BACKUPS_MAX_COUNT:-48}

    # Loopback, so the tunnel is the only way in. Set VALHEIM_BIND to the host's
    # LAN address to let players on the network connect direct.
    ports:
      - "${VALHEIM_BIND:-127.0.0.1}:2456-2458:2456-2458/udp"

    # /opt/valheim is deliberately not a volume. It holds the SteamCMD download,
    # which is derived data Steam can always refetch. Persisting it also persists
    # a failed download: steamcmd gets stuck reporting
    #   Error! App '896660' state is 0x6 after update job
    # and the updater falls back to the stale binary while logging that the server
    # is already the latest version. Players then get "incompatible version" with
    # nothing in the log admitting why. Keeping it in the container layer costs a
    # ~2GB refetch on recreate and makes a redeploy the fix for any stuck update.
    volumes:
      - valheim_config:/config

    networks:
      - valheim

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: ${VALHEIM_MEM_LIMIT:-4g}
          cpus: ${VALHEIM_CPUS:-2.0}
        reservations:
          memory: 1g

    # The image ships none, and the stack_deploy role gates on `up --wait`.
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status valheim-server | grep -q RUNNING"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0.10
    container_name: valheim-playit
    restart: unless-stopped

    network_mode: "service:valheim"

    depends_on:
      valheim:
        condition: service_healthy

    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:?PLAYIT_SECRET_KEY not set}

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
        reservations:
          memory: 32m

volumes:
  valheim_config:

networks:
  valheim:
