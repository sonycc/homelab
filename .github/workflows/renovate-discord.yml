name: Renovate to Discord

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENTION: ${{ vars.DISCORD_MENTION }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n --arg mention "$MENTION" --arg title "$TITLE" --arg url "$URL" \
            '{content: "\($mention) **Image update available** - \($title)\n\($url)", allowed_mentions: {parse: ["users", "roles"]}}' \
          | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
